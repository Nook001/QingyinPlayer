[workspace]
members = [
    "crates/chinese",
    "crates/core",
    "crates/library",
    "crates/metadata",
    "crates/player",
    "crates/storage",
    "crates/ui_bridge",
]
default-members = ["crates/ui_bridge"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"

[workspace.dependencies]
cstr = "0.2.12"
gstreamer = "0.25.3"
icu_collator = "2.3.1"
image = { version = "0.25.8", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff"] }
lofty = "0.25.2"
notify = "8.2.0"
pinyin = "0.11.0"
qmetaobject = "0.2.10"
rusqlite = { version = "0.40.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"
zbus = "5.19.0"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
